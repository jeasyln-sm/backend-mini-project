<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<div layout:fragment="content" class="container my-3">
    <!-- 게시글 제목 -->
    <h2 class="border-bottom py-2" th:text="${post.title}"></h2>
    <div class="card my-3">
        <div class="card-body">
            <div class="card-text" th:utext="${@commonUtil.markdown(post.content)}"></div>
            <div class="d-flex justify-content-end">
                <div class="badge bg-light text-dark p-2 text-start mx-3">
                    <div class="mb-2">modified at</div>
                    <div th:text="${post.modDate}"></div> <!-- Directly display modDate -->
                </div>
                <div class="badge bg-light text-dark p-2 text-start">
                    <div class="mb-2">
                        <span th:text="${post.memberName}"></span>
                    </div>
                    <div th:text="${post.creDate}"></div> <!-- Directly display creDate -->
                </div>
            </div>
            <div class="my-3">
                <!-- 추천 기능을 주석 처리했습니다. -->
                <!-- <a href="javascript:void(0);" class="recommend btn btn-sm btn-outline-secondary"
                   th:data-uri="@{|/posts/vote/${post.id}|}">
                    추천
                    <span class="badge rounded-pill bg-success" th:text="${#lists.size(post.voter)}"></span>
                </a> -->
                <a th:href="@{|/posts/modify/${post.id}|}" class="btn btn-sm btn-outline-secondary"
                   sec:authorize="isAuthenticated()"
                   th:if="${post.memberName != null and #authentication.getPrincipal().getUsername() == post.memberName}"
                   th:text="수정"></a>
                <a href="javascript:void(0);" th:data-uri="@{|/posts/delete/${post.id}|}"
                   class="delete btn btn-sm btn-outline-secondary" sec:authorize="isAuthenticated()"
                   th:if="${post.memberName != null and #authentication.getPrincipal().getUsername() == post.memberName}"
                   th:text="삭제"></a>
            </div>
        </div>
    </div>

<script layout:fragment="script" type='text/javascript'>
const delete_elements = document.getElementsByClassName("delete");
Array.from(delete_elements).forEach(function(element) {
    element.addEventListener('click', function() {
        if(confirm("정말로 삭제하시겠습니까?")) {
            location.href = this.dataset.uri;
        };
    });
});
const recommend_elements = document.getElementsByClassName("recommend");
Array.from(recommend_elements).forEach(function(element) {
    element.addEventListener('click', function() {
        if(confirm("정말로 추천하시겠습니까?")) {
            location.href = this.dataset.uri;
        };
    });
});
</script>
